[project]
name = "pricing-the-unpriced"
version = "0.1.0"
description = "Sponsor data package and starter notebook for the NYU CUSP 2026-2027 capstone Pricing the Unpriced"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "matplotlib>=3.8",
    "jupyterlab>=4.2",
    "jupytext>=1.19",
]

[dependency-groups]
# Installed by `uv sync` by default. Keeps notebook outputs out of git (see .pre-commit-config.yaml).
dev = [
    "nbstripout>=0.9",
    "pre-commit>=4.0",
]

[tool.uv]
package = false
